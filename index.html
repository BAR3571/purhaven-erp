<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warehouse · Purhaven Back Office</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body data-page="warehouse">

<div class="page-header">
  <h1>🏭 Warehouse</h1>
</div>

<div class="tile-row">
  <div class="tile tile-orange">
    <div class="label">⏳ Pending picks</div>
    <div class="val" id="t-pending">—</div>
    <div class="sub">awaiting assignment</div>
  </div>
  <div class="tile tile-purple">
    <div class="label">📦 In picking</div>
    <div class="val" id="t-picking">—</div>
    <div class="sub">to confirm</div>
  </div>
  <div class="tile tile-green">
    <div class="label">📤 Packed</div>
    <div class="val" id="t-packed">—</div>
    <div class="sub">awaiting despatch</div>
  </div>
  <div class="tile tile-sky">
    <div class="label">🚚 Despatched today</div>
    <div class="val" id="t-despatched">—</div>
    <div class="sub" id="t-week-sub">0 this week</div>
  </div>
</div>

<div class="card accent-orange">
  <h2 style="margin: 0 0 4px;">Phase 1 in progress</h2>
  <p style="color: var(--ink-soft); margin: 0;">Modules unlock as they ship: Customers ✓ · Suppliers ✓ · Products &amp; Stock · Orders &amp; Despatch.</p>
</div>

<script type="module">
  import { mountShell } from '/app.js';
  await mountShell();
</script>

</body>
</html>
