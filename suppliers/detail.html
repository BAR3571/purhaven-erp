<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supplier · PurHaven Back Office</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script src="/assets/js/entity-modals.js" defer></script>
<style>
  .twocol { display: grid; grid-template-columns: 2fr 3fr; gap: 18px; align-items: start; }
  @media (max-width: 1000px) { .twocol { grid-template-columns: 1fr; } }
  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .subcard { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .subcard .row { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .subcard h4 { margin: 0 0 4px; font-size: 0.95rem; }
  .subcard .meta { color: var(--ink-soft); font-size: 0.82rem; }
  .badge-mini { display:inline-block; padding:1px 7px; border-radius:99px; background: var(--bg); border: 1px solid var(--border); font-size: 0.7rem; color: var(--ink-soft); margin-left: 4px; }
  .err { color: #991b1b; }
  .ok { color: #065f46; }
</style>
</head>
<body data-page="suppliers">

<div id="page-header" class="page-header">
  <div>
    <a href="/suppliers" style="color:var(--ink-dim);font-size:0.85rem;">← Suppliers</a>
    <h1 id="title" style="margin:4px 0 0;">Supplier</h1>
  </div>
  <div class="actions" id="actions"></div>
</div>

<div id="status-msg" style="margin-bottom:12px;"></div>

<div class="twocol">
  <div>
    <div class="card accent-sky">
      <h2 style="margin-top:0">Details</h2>
      <form id="supplier-form">
        <div class="field-row">
          <div class="field">
            <label for="f-account">Account #</label>
            <input type="text" id="f-account" name="account_code" placeholder="auto-generated">
          </div>
          <div class="field">
            <label for="f-currency">Currency</label>
            <select id="f-currency" name="currency">
              <option value="GBP">GBP</option>
              <option value="EUR">EUR</option>
              <option value="USD">USD</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="f-name">Name *</label>
          <input type="text" id="f-name" name="name" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="f-vat">VAT number</label>
            <input type="text" id="f-vat" name="vat_number">
          </div>
          <div class="field">
            <label for="f-eori">EORI number</label>
            <input type="text" id="f-eori" name="eori_number">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="f-terms">Payment terms</label>
            <input type="text" id="f-terms" name="payment_terms" placeholder="e.g. Net 30, On receipt">
          </div>
          <div class="field">
            <label for="f-lead">Lead time (days)</label>
            <input type="number" id="f-lead" name="lead_time_days" min="0" step="1">
          </div>
        </div>
        <div class="field">
          <label for="f-notes">Notes</label>
          <textarea id="f-notes" name="notes" rows="3"></textarea>
        </div>

        <div class="toolbar" style="margin-top:8px;">
          <button type="submit" class="btn btn-primary" id="save-btn">Save</button>
          <button type="button" class="btn btn-danger" id="deactivate-btn" style="display:none;">Deactivate</button>
        </div>
      </form>
    </div>
  </div>

  <div id="relations" style="display:none;">
    <div class="card accent-purple">
      <div class="row" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <h2 style="margin:0;">Contacts</h2>
        <button type="button" class="btn btn-sky" id="add-contact-btn">+ Add contact</button>
      </div>
      <div id="contacts"></div>
    </div>

    <div class="card accent-orange">
      <div class="row" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <h2 style="margin:0;">Addresses</h2>
        <button type="button" class="btn btn-sky" id="add-address-btn">+ Add address</button>
      </div>
      <div id="addresses"></div>
    </div>
  </div>
</div>

<script type="module">
  import { mountShell, fmt } from '/app.js';
  await mountShell();

  const params = new URLSearchParams(window.location.search);
  const rawId = params.get('id');
  const isNew = !rawId || rawId === 'new';
  const id = isNew ? null : parseInt(rawId, 10);

  const titleEl = document.getElementById('title');
  const statusEl = document.getElementById('status-msg');
  const form = document.getElementById('supplier-form');
  const saveBtn = document.getElementById('save-btn');
  const deactivateBtn = document.getElementById('deactivate-btn');
  const relationsEl = document.getElementById('relations');
  const contactsEl = document.getElementById('contacts');
  const addressesEl = document.getElementById('addresses');

  // Cached copy of the current supplier — used by the edit handlers so we can
  // pre-fill the modal with existing data.
  let currentSupplier = null;

  function setStatus(msg, cls) {
    statusEl.innerHTML = msg ? `<div class="card accent-${cls === 'err' ? 'pink' : 'green'}" style="padding:10px 14px;"><span class="${cls}">${msg}</span></div>` : '';
    if (msg) setTimeout(() => { statusEl.innerHTML = ''; }, 4000);
  }

  function fillForm(s) {
    document.getElementById('f-account').value = s.account_code || '';
    document.getElementById('f-name').value    = s.name || '';
    document.getElementById('f-vat').value     = s.vat_number || '';
    document.getElementById('f-eori').value    = s.eori_number || '';
    document.getElementById('f-currency').value= s.currency || 'GBP';
    document.getElementById('f-terms').value   = s.payment_terms || '';
    document.getElementById('f-lead').value    = s.lead_time_days != null ? s.lead_time_days : '';
    document.getElementById('f-notes').value   = s.notes || '';
  }

  function renderContacts(contacts) {
    if (contacts.length === 0) { contactsEl.innerHTML = '<p style="color:var(--ink-dim);margin:0;">No contacts yet.</p>'; return; }
    contactsEl.innerHTML = contacts.map(c => `
      <div class="subcard" data-cid="${c.id}">
        <div class="row">
          <div>
            <h4>${fmt(c.name)} ${c.is_primary ? '<span class="badge-mini">Primary</span>' : ''}</h4>
            <div class="meta">${fmt(c.position) === '—' ? '' : fmt(c.position) + ' · '}${fmt(c.email)} ${c.phone ? '· ' + fmt(c.phone) : ''}</div>
          </div>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-ghost" data-action="edit-contact" data-cid="${c.id}">Edit</button>
            <button class="btn btn-danger" data-action="del-contact" data-cid="${c.id}">×</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  function renderAddresses(addresses) {
    if (addresses.length === 0) { addressesEl.innerHTML = '<p style="color:var(--ink-dim);margin:0;">No addresses yet.</p>'; return; }
    addressesEl.innerHTML = addresses.map(a => `
      <div class="subcard" data-aid="${a.id}">
        <div class="row">
          <div>
            <h4>${fmt(a.label) === '—' ? 'Address' : fmt(a.label)}
              <span class="badge-mini">${a.type}</span>
              ${a.is_default ? '<span class="badge-mini">Default</span>' : ''}
            </h4>
            <div class="meta">
              ${[a.line1, a.line2, a.city, a.county, a.postcode, a.country].filter(Boolean).map(fmt).join(', ')}
            </div>
          </div>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-ghost" data-action="edit-address" data-aid="${a.id}">Edit</button>
            <button class="btn btn-danger" data-action="del-address" data-aid="${a.id}">×</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  async function loadSupplier() {
    if (isNew) { titleEl.textContent = 'New supplier'; return; }
    const r = await fetch('/api/suppliers/' + id);
    const d = await r.json();
    if (!d.ok) { setStatus('Failed to load: ' + d.error, 'err'); return; }
    currentSupplier = d.supplier;
    fillForm(d.supplier);
    titleEl.textContent = d.supplier.name + ' · ' + d.supplier.account_code;
    relationsEl.style.display = 'block';
    deactivateBtn.style.display = d.supplier.active ? 'inline-flex' : 'none';
    renderContacts(d.supplier.contacts);
    renderAddresses(d.supplier.addresses);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';
    const fd = new FormData(form);
    const leadDays = fd.get('lead_time_days');
    const body = {
      account_code: fd.get('account_code') || undefined,
      name: fd.get('name'),
      vat_number: fd.get('vat_number') || null,
      eori_number: fd.get('eori_number') || null,
      currency: fd.get('currency') || 'GBP',
      payment_terms: fd.get('payment_terms') || null,
      lead_time_days: leadDays ? parseInt(leadDays, 10) : null,
      notes: fd.get('notes') || null
    };
    const url = isNew ? '/api/suppliers' : '/api/suppliers/' + id;
    const method = isNew ? 'POST' : 'PUT';
    const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json();
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save';
    if (!d.ok) { setStatus('Save failed: ' + d.error, 'err'); return; }
    if (isNew) {
      window.location.href = '/suppliers/detail?id=' + d.supplier.id;
    } else {
      setStatus('Saved.', 'ok');
      loadSupplier();
    }
  });

  deactivateBtn.addEventListener('click', async () => {
    if (!confirm('Deactivate this supplier? You can re-activate later.')) return;
    const r = await fetch('/api/suppliers/' + id, { method: 'DELETE' });
    const d = await r.json();
    if (!d.ok) { setStatus('Failed: ' + d.error, 'err'); return; }
    window.location.href = '/suppliers';
  });

  document.getElementById('add-contact-btn').addEventListener('click', () => {
    PurhavenModals.openContactModal({
      contact: null,
      onSubmit: async (payload) => {
        const r = await fetch('/api/suppliers/' + id + '/contacts', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const d = await r.json();
        if (!d.ok) throw new Error(d.error || 'Add failed');
        loadSupplier();
      }
    });
  });

  contactsEl.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const cid = btn.dataset.cid;
    if (btn.dataset.action === 'del-contact') {
      if (!confirm('Delete this contact?')) return;
      const r = await fetch('/api/suppliers/' + id + '/contacts/' + cid, { method: 'DELETE' });
      const d = await r.json();
      if (!d.ok) { setStatus('Delete failed: ' + d.error, 'err'); return; }
      loadSupplier();
    } else if (btn.dataset.action === 'edit-contact') {
      const contact = (currentSupplier?.contacts || []).find(c => String(c.id) === String(cid));
      if (!contact) { setStatus('Contact not found — reloading.', 'err'); loadSupplier(); return; }
      PurhavenModals.openContactModal({
        contact,
        onSubmit: async (payload) => {
          const r = await fetch('/api/suppliers/' + id + '/contacts/' + cid, {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const d = await r.json();
          if (!d.ok) throw new Error(d.error || 'Update failed');
          loadSupplier();
        }
      });
    }
  });

  document.getElementById('add-address-btn').addEventListener('click', () => {
    PurhavenModals.openAddressModal({
      address: null,
      onSubmit: async (payload) => {
        const r = await fetch('/api/suppliers/' + id + '/addresses', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const d = await r.json();
        if (!d.ok) throw new Error(d.error || 'Add failed');
        loadSupplier();
      }
    });
  });

  addressesEl.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const aid = btn.dataset.aid;
    if (btn.dataset.action === 'del-address') {
      if (!confirm('Delete this address?')) return;
      const r = await fetch('/api/suppliers/' + id + '/addresses/' + aid, { method: 'DELETE' });
      const d = await r.json();
      if (!d.ok) { setStatus('Delete failed: ' + d.error, 'err'); return; }
      loadSupplier();
    } else if (btn.dataset.action === 'edit-address') {
      const address = (currentSupplier?.addresses || []).find(a => String(a.id) === String(aid));
      if (!address) { setStatus('Address not found — reloading.', 'err'); loadSupplier(); return; }
      PurhavenModals.openAddressModal({
        address,
        onSubmit: async (payload) => {
          const r = await fetch('/api/suppliers/' + id + '/addresses/' + aid, {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const d = await r.json();
          if (!d.ok) throw new Error(d.error || 'Update failed');
          loadSupplier();
        }
      });
    }
  });

  loadSupplier();
</script>

</body>
</html>
