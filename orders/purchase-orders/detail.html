<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purchase Order · PurHaven Back Office</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .po-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 1000px) { .po-grid { grid-template-columns: 1fr; } }
  .totals-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 6px 0; }
  .totals-row.grand { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 12px; font-weight: 700; font-size: 1.1rem; }
  .err { color: #991b1b; }
  .ok { color: #065f46; }
  .line-row td input { background: transparent; border: 1px solid transparent; padding: 4px 6px; }
  .line-row td input:hover, .line-row td input:focus { border-color: var(--border); background: var(--bg); }
  .line-row td input.num { text-align: right; }
</style>
</head>
<body data-page="orders">

<div id="tabs-mount"></div>

<div id="page-header" class="page-header">
  <div>
    <a href="/orders/purchase-orders" style="color:var(--ink-dim);font-size:0.85rem;">← Purchase Orders</a>
    <h1 id="title" style="margin:4px 0 0;">Purchase Order</h1>
    <div id="subtitle" style="color:var(--ink-soft);margin-top:4px;font-size:0.9rem;"></div>
  </div>
  <div class="actions" id="actions"></div>
</div>

<div id="status-msg" style="margin-bottom:12px;"></div>

<div class="po-grid">
  <div class="card accent-sky">
    <h2 style="margin-top:0">Order details</h2>
    <form id="po-form">
      <div class="field-row">
        <div class="field">
          <label for="f-supplier-ref">Supplier reference (their PO/quote)</label>
          <input type="text" id="f-supplier-ref">
        </div>
        <div class="field">
          <label for="f-expected-date">Expected by</label>
          <input type="date" id="f-expected-date">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-order-date">Order date</label>
          <input type="date" id="f-order-date">
        </div>
        <div class="field">
          <label for="f-currency">Currency</label>
          <select id="f-currency">
            <option value="GBP">GBP</option>
            <option value="EUR">EUR</option>
            <option value="USD">USD</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="f-notes">Notes</label>
        <textarea id="f-notes" rows="2"></textarea>
      </div>
      <button type="submit" class="btn btn-primary" id="save-btn">Save header</button>
    </form>
  </div>

  <div class="card accent-orange">
    <h2 style="margin-top:0">Deliver to</h2>
    <div class="field">
      <label for="f-warehouse">Warehouse</label>
      <select id="f-warehouse"></select>
    </div>
    <p style="color:var(--ink-soft);font-size:0.85rem;margin:0;">Stock arrives here when this PO is received via the Goods In module.</p>
  </div>
</div>

<div class="card accent-purple" id="lines-card">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
    <h2 style="margin:0;">Lines</h2>
    <button type="button" class="btn btn-sky" id="add-line-btn">+ Add line</button>
  </div>
  <div class="table-wrap">
    <table class="data">
      <thead>
        <tr>
          <th style="width:32px">#</th>
          <th>SKU</th>
          <th>Description / allocated to</th>
          <th style="text-align:right;width:80px">Qty</th>
          <th style="text-align:right;width:90px">Received</th>
          <th style="text-align:right;width:120px">Unit cost (£)</th>
          <th style="text-align:right;width:80px">VAT %</th>
          <th style="text-align:right;width:120px">Line total</th>
          <th style="width:40px"></th>
        </tr>
      </thead>
      <tbody id="lines-body">
        <tr><td colspan="9" class="empty">No lines yet.</td></tr>
      </tbody>
    </table>
  </div>
  <div style="display:grid;grid-template-columns:1fr 280px;gap:10px;margin-top:14px;">
    <div></div>
    <div>
      <div class="totals-row"><span>Subtotal (ex VAT)</span><strong id="t-subtotal">£0.00</strong></div>
      <div class="totals-row"><span>VAT</span><strong id="t-vat">£0.00</strong></div>
      <div class="totals-row grand"><span>Total</span><strong id="t-total">£0.00</strong></div>
    </div>
  </div>
</div>

<script type="module">
  import { mountShell, renderOrdersTabs, fmt, money, dateOnly, openProductPicker, mountScanPanel } from '/app.js';
  await mountShell();
  document.getElementById('tabs-mount').innerHTML = `<div class="orders-tabs">${renderOrdersTabs('purchase-orders')}</div>`;

  const params = new URLSearchParams(window.location.search);
  const id = parseInt(params.get('id'), 10);
  if (!id) { alert('No order id'); location.href = '/orders/purchase-orders'; }

  const titleEl = document.getElementById('title');
  const subtitleEl = document.getElementById('subtitle');
  const statusEl = document.getElementById('status-msg');
  const actionsEl = document.getElementById('actions');
  const linesBody = document.getElementById('lines-body');
  const warehouseSel = document.getElementById('f-warehouse');

  function setStatus(msg, cls) {
    statusEl.innerHTML = msg
      ? `<div class="card accent-${cls === 'err' ? 'pink' : 'green'}" style="padding:10px 14px;"><span class="${cls}">${msg}</span></div>`
      : '';
    if (msg) setTimeout(() => { statusEl.innerHTML = ''; }, 4000);
  }

  async function preload() {
    const r = await fetch('/api/warehouses');
    const d = await r.json();
    if (d.ok) warehouseSel.innerHTML = d.warehouses.map(w => `<option value="${w.id}">${w.code} — ${w.name}</option>`).join('');
  }

  function fillHeader(po) {
    titleEl.textContent = `${po.po_number} · ${po.supplier_name}`;
    subtitleEl.textContent = `${po.status.replace(/_/g, ' ')} · order ${dateOnly(po.order_date)}` +
                             (po.expected_date ? ` · expected ${dateOnly(po.expected_date)}` : '');
    document.getElementById('f-supplier-ref').value = po.supplier_ref || '';
    document.getElementById('f-expected-date').value = po.expected_date ? po.expected_date.slice(0,10) : '';
    document.getElementById('f-order-date').value    = po.order_date ? po.order_date.slice(0,10) : '';
    document.getElementById('f-currency').value      = po.currency || 'GBP';
    document.getElementById('f-notes').value         = po.notes || '';
    if (po.deliver_to_warehouse_id) warehouseSel.value = po.deliver_to_warehouse_id;
  }

  function fillTotals(po) {
    document.getElementById('t-subtotal').textContent = money(po.subtotal_pence, po.currency);
    document.getElementById('t-vat').textContent      = money(po.vat_pence, po.currency);
    document.getElementById('t-total').textContent    = money(po.total_pence, po.currency);
  }

  function fillActions(po) {
    const buttons = [];
    if (po.status === 'draft') buttons.push(`<button type="button" class="btn btn-primary" data-act="release">Release to supplier</button>`);
    if (['released', 'part_received'].includes(po.status)) buttons.push(`<button type="button" class="btn btn-primary" data-act="receive">↘ Receive stock</button>`);
    // View + email PDF — visible on any non-draft PO (or draft with lines, as a preview)
    if (po.lines.length > 0) {
      buttons.push(`<a class="btn btn-ghost" href="/api/purchase-orders/${po.id}/paperwork/po" target="_blank" rel="noopener">📄 View PO PDF</a>`);
    }
    if (['released', 'part_received', 'received'].includes(po.status)) {
      const emailLabel = po.po_email_sent_at ? '📧 Re-send to supplier' : '📧 Email to supplier';
      buttons.push(`<button type="button" class="btn btn-primary" data-act="email">${emailLabel}</button>`);
    }
    if (['draft', 'released', 'part_received'].includes(po.status)) buttons.push(`<button type="button" class="btn btn-danger" data-act="cancel">Cancel</button>`);
    if (['part_received', 'received'].includes(po.status)) buttons.push(`<button type="button" class="btn btn-ghost" data-act="close">Close</button>`);
    if (po.status === 'draft' && po.lines.length === 0) buttons.push(`<button type="button" class="btn btn-danger" data-act="delete">Delete</button>`);
    actionsEl.innerHTML = buttons.join(' ');

    // Remove any stale stamp before adding a fresh one
    const oldStamp = document.getElementById('po-email-stamp');
    if (oldStamp) oldStamp.remove();

    // Show a "last emailed" line under the actions when applicable
    if (po.po_email_sent_at) {
      const when = new Date(po.po_email_sent_at).toLocaleString('en-GB');
      const to = po.po_email_to || '(unknown)';
      actionsEl.insertAdjacentHTML('afterend',
        `<p style="margin:6px 0 0;color:var(--ink-soft);font-size:0.8rem;" id="po-email-stamp">✓ PO PDF emailed to ${escapeText(to)} on ${when}${po.onedrive_folder_url ? ` · <a href="${po.onedrive_folder_url}" target="_blank" rel="noopener">📂 SharePoint folder</a>` : ''}</p>`
      );
    }
  }

  function escapeText(s) {
    if (s == null) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function openReceiveModal(po) {
    const openLines = po.lines.filter(l => (l.quantity_ordered - l.quantity_received) > 0);
    if (openLines.length === 0) { alert('Nothing left to receive on this PO.'); return; }

    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal-card" onclick="event.stopPropagation()">
        <button type="button" class="x" data-close>×</button>
        <h2 style="margin:0 0 4px;">Receive stock for ${fmt(po.po_number)}</h2>
        <p style="margin:0 0 14px;color:var(--ink-soft);font-size:0.85rem;">Confirm quantities arriving today. Serial numbers required on serialised products.</p>

        <div class="field-row" style="margin-bottom:8px;">
          <div class="field" style="margin:0;">
            <label for="r-carrier">Carrier</label>
            <input type="text" id="r-carrier" placeholder="e.g. DPD, Royal Mail, supplier own">
          </div>
          <div class="field" style="margin:0;">
            <label for="r-tracking">Tracking #</label>
            <input type="text" id="r-tracking">
          </div>
        </div>
        <div class="field">
          <label for="r-notes">Notes</label>
          <textarea id="r-notes" rows="2" placeholder="Anything unusual about this delivery?"></textarea>
        </div>

        <div id="r-scan-wrap" style="display:none;">
          <div id="r-scan"></div>
          <div style="display:flex;justify-content:flex-end;margin:-6px 0 10px;">
            <button type="button" class="btn btn-ghost" id="r-scan-reset" style="font-size:0.78rem;padding:4px 8px;">↺ Reset qtys to 0 (scan mode)</button>
          </div>
        </div>

        <div id="r-lines"></div>

        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;">
          <button type="button" class="btn btn-ghost" data-close>Cancel</button>
          <button type="button" class="btn btn-primary" id="r-submit">Confirm receipt</button>
        </div>
      </div>
    `;
    backdrop.addEventListener('click', (e) => {
      if (e.target === backdrop || e.target.dataset.close !== undefined) backdrop.remove();
    });
    document.body.appendChild(backdrop);

    const linesEl = backdrop.querySelector('#r-lines');
    linesEl.innerHTML = openLines.map(l => {
      const remaining = l.quantity_ordered - l.quantity_received;
      const needsSerial = !!l.requires_serial;
      return `
        <div class="alloc-item" style="grid-template-columns:1fr; padding:10px; border:1px solid var(--border); border-radius:8px; margin-bottom:8px; display:block;" data-pol="${l.id}" data-pid="${l.product_id || ''}" data-needs-serial="${needsSerial ? '1' : ''}">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
            <div>
              <strong class="sn">${fmt(l.sku)}</strong> · ${fmt(l.description)}
              <div class="meta">ordered ${l.quantity_ordered} · already received ${l.quantity_received} · ${remaining} remaining${needsSerial ? ' · serialised' : ''}</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <input class="num qty-in" type="number" min="0" max="${remaining}" value="${remaining}" style="width:80px;">
              <select class="cond-in" style="padding:6px;">
                <option value="good">Good</option>
                <option value="damaged">Damaged</option>
                <option value="quarantine">Quarantine</option>
              </select>
            </div>
          </div>
          ${needsSerial ? `
            <div class="field" style="margin-top:8px;margin-bottom:0;">
              <label>Serial numbers (one per line, qty must match)</label>
              <textarea class="serials-in" rows="3" placeholder="MAP-2026-0001
MAP-2026-0002"></textarea>
            </div>
          ` : ''}
        </div>
      `;
    }).join('');

    // Mount scan panel (shows up only if at least one line is open)
    const scanWrap = backdrop.querySelector('#r-scan-wrap');
    const scanMount = backdrop.querySelector('#r-scan');
    if (openLines.length > 0) {
      scanWrap.style.display = '';
      let scanTargetPol = null;
      mountScanPanel(scanMount, {
        label: 'Scan SKU or serial',
        placeholder: 'Aim scanner here or type and press Enter…',
        async onScan(value, h) {
          const rows = Array.from(backdrop.querySelectorAll('[data-pol]'));
          const norm = value.trim();
          if (!norm) return;

          // 1) Exact SKU match — set as scan target and bump qty
          const skuRow = rows.find(r => (r.querySelector('.sn')?.textContent || '').trim().toUpperCase() === norm.toUpperCase());
          if (skuRow) {
            scanTargetPol = skuRow.dataset.pol;
            const ok = bumpQty(skuRow, h);
            if (ok) {
              flashRow(skuRow);
              h.flashOk('SKU ' + skuRow.querySelector('.sn').textContent.trim());
            }
            return;
          }

          // 2) Treat value as a serial number
          let serialRow = null;
          if (scanTargetPol) {
            serialRow = rows.find(r => r.dataset.pol === scanTargetPol && r.dataset.needsSerial === '1');
          }
          if (!serialRow) {
            const sRows = rows.filter(r => r.dataset.needsSerial === '1');
            if (sRows.length === 1) serialRow = sRows[0];
          }
          if (!serialRow) {
            h.flashErr('Unknown — scan the SKU first to target a line');
            return;
          }
          const ta = serialRow.querySelector('.serials-in');
          const existing = ta.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
          if (existing.includes(norm)) { h.flashErr('Already scanned: ' + norm); return; }
          if (!bumpQty(serialRow, h)) return;
          existing.push(norm);
          ta.value = existing.join('\n');
          flashRow(serialRow);
          h.flashOk('+ ' + norm);
        }
      });

      backdrop.querySelector('#r-scan-reset').addEventListener('click', () => {
        backdrop.querySelectorAll('.qty-in').forEach(el => el.value = '0');
        backdrop.querySelectorAll('.serials-in').forEach(el => el.value = '');
        scanTargetPol = null;
      });
    }

    function bumpQty(row, h) {
      const q = row.querySelector('.qty-in');
      const max = parseInt(q.max, 10);
      const cur = parseInt(q.value, 10) || 0;
      if (Number.isFinite(max) && cur >= max) { h.flashErr('Already at remaining cap'); return false; }
      q.value = cur + 1;
      return true;
    }
    function flashRow(row) {
      row.classList.remove('scan-hit'); void row.offsetWidth; row.classList.add('scan-hit');
    }

    backdrop.querySelector('#r-submit').addEventListener('click', async () => {
      const lines = [];
      const rows = backdrop.querySelectorAll('[data-pol]');
      for (const row of rows) {
        const qty = parseInt(row.querySelector('.qty-in').value, 10);
        if (!qty || qty < 1) continue;
        const condition = row.querySelector('.cond-in').value;
        const serialsTextarea = row.querySelector('.serials-in');
        const serials = serialsTextarea
          ? serialsTextarea.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean)
          : [];
        lines.push({
          po_line_id: parseInt(row.dataset.pol, 10),
          product_id: parseInt(row.dataset.pid, 10) || null,
          qty_received: qty,
          condition,
          serials
        });
      }
      if (lines.length === 0) { alert('Enter at least one qty.'); return; }

      const submitBtn = backdrop.querySelector('#r-submit');
      submitBtn.disabled = true; submitBtn.textContent = 'Receiving…';

      const r = await fetch('/api/goods-in', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          po_id: po.id,
          warehouse_id: po.deliver_to_warehouse_id,
          carrier: backdrop.querySelector('#r-carrier').value || null,
          tracking_number: backdrop.querySelector('#r-tracking').value || null,
          notes: backdrop.querySelector('#r-notes').value || null,
          lines
        })
      });
      const d = await r.json();
      submitBtn.disabled = false; submitBtn.textContent = 'Confirm receipt';
      if (!d.ok) { alert('Receive failed: ' + d.error); return; }
      backdrop.remove();
      location.href = '/orders/goods-in/detail?id=' + d.gi_id;
    });
  }

  function lineTotalPence(qty, cost) {
    return Math.round(qty * cost);
  }

  function renderAllocations(allocs) {
    if (!allocs || allocs.length === 0) {
      return '<div style="margin-top:4px;color:var(--ink-dim);font-size:0.78rem;">Unallocated</div>';
    }
    const chips = allocs.map(a => `
      <span class="alloc-chip">
        <a href="/orders/sales-orders/detail?id=${a.so_id}" style="color:inherit;text-decoration:none;font-weight:600;">${fmt(a.so_number)}</a>
        · <a href="/customers/detail?id=${a.customer_id}" style="color:inherit;text-decoration:none;">${fmt(a.customer_name)}</a>
        · ×${a.qty}
        <button class="x" data-act="unalloc-po" data-aid="${a.id}" title="Remove allocation">×</button>
      </span>
    `).join('');
    return `<div style="margin-top:6px;">${chips}</div>`;
  }

  function renderLines(po) {
    if (po.lines.length === 0) {
      linesBody.innerHTML = '<tr><td colspan="9" class="empty">No lines yet — click <strong>+ Add line</strong> to start.</td></tr>';
      return;
    }
    const editable = !['received', 'closed', 'cancelled'].includes(po.status);
    linesBody.innerHTML = po.lines.map(l => {
      const lineSub = lineTotalPence(l.quantity_ordered, l.unit_cost_pence);
      const allocated = Number(l.qty_allocated_to_sos || 0);
      const allocBadge = allocated > 0
        ? `<div style="margin-top:4px;font-size:0.78rem;color:var(--sky-deep);">Allocated to SOs: ${allocated} of ${l.quantity_ordered}</div>`
        : '';
      return `
        <tr class="line-row" data-lid="${l.id}">
          <td class="mono">${l.line_no}</td>
          <td class="mono"><strong>${fmt(l.sku)}</strong></td>
          <td>
            <input type="text" data-f="description" value="${(l.description||'').replace(/"/g,'&quot;')}" ${editable ? '' : 'readonly'}>
            ${allocBadge}
            ${renderAllocations(l.allocated_so_lines)}
          </td>
          <td><input class="num" type="number" data-f="quantity_ordered" min="1" value="${l.quantity_ordered}" ${editable ? '' : 'readonly'}></td>
          <td style="text-align:right;color:${l.quantity_received > 0 ? 'var(--green)' : 'var(--ink-dim)'};">${l.quantity_received}</td>
          <td><input class="num" type="number" data-f="unit_cost_pounds" step="0.01" min="0" value="${(l.unit_cost_pence/100).toFixed(2)}" ${editable ? '' : 'readonly'}></td>
          <td><input class="num" type="number" data-f="vat_rate_percent" min="0" max="100" value="${l.vat_rate_percent}" ${editable ? '' : 'readonly'}></td>
          <td style="text-align:right"><strong>${money(lineSub, po.currency)}</strong></td>
          <td>${editable ? `<button class="btn btn-danger" data-act="del-line" data-lid="${l.id}">×</button>` : ''}</td>
        </tr>
      `;
    }).join('');
  }

  let currentPo = null;
  async function load() {
    const r = await fetch('/api/purchase-orders/' + id);
    const d = await r.json();
    if (!d.ok) { setStatus('Load failed: ' + d.error, 'err'); return; }
    currentPo = d.purchase_order;
    fillHeader(currentPo);
    fillTotals(currentPo);
    fillActions(currentPo);
    renderLines(currentPo);
  }

  document.getElementById('po-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = {
      supplier_ref:    document.getElementById('f-supplier-ref').value || null,
      expected_date:   document.getElementById('f-expected-date').value || null,
      order_date:      document.getElementById('f-order-date').value || null,
      currency:        document.getElementById('f-currency').value,
      notes:           document.getElementById('f-notes').value || null,
      deliver_to_warehouse_id: parseInt(warehouseSel.value, 10) || null
    };
    const r = await fetch('/api/purchase-orders/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json();
    if (!d.ok) { setStatus('Save failed: ' + d.error, 'err'); return; }
    setStatus('Header saved.', 'ok');
    load();
  });

  document.getElementById('add-line-btn').addEventListener('click', async () => {
    const pick = await openProductPicker({ title: 'Add line to ' + currentPo.po_number, confirmLabel: 'Add line' });
    if (!pick) return;
    const cr = await fetch('/api/purchase-orders/' + id + '/lines', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ product_id: pick.product.id, quantity_ordered: pick.qty })
    });
    const cd = await cr.json();
    if (!cd.ok) { setStatus('Add failed: ' + cd.error, 'err'); return; }
    load();
  });

  let editTimer = null;
  linesBody.addEventListener('input', (e) => {
    const inp = e.target;
    if (!inp.dataset.f) return;
    const tr = inp.closest('tr');
    const lid = tr.dataset.lid;
    clearTimeout(editTimer);
    editTimer = setTimeout(async () => {
      const get = (f) => tr.querySelector(`[data-f="${f}"]`).value;
      const body = {
        description: get('description'),
        quantity_ordered: parseInt(get('quantity_ordered'), 10),
        unit_cost_pence: Math.round(parseFloat(get('unit_cost_pounds')) * 100),
        vat_rate_percent: parseInt(get('vat_rate_percent'), 10)
      };
      const r = await fetch('/api/purchase-orders/' + id + '/lines/' + lid, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
      const d = await r.json();
      if (!d.ok) { setStatus('Line save failed: ' + d.error, 'err'); return; }
      load();
    }, 400);
  });

  linesBody.addEventListener('click', async (e) => {
    const delBtn = e.target.closest('button[data-act="del-line"]');
    const unallocBtn = e.target.closest('button[data-act="unalloc-po"]');
    if (delBtn) {
      if (!confirm('Delete this line?')) return;
      const lid = delBtn.dataset.lid;
      const r = await fetch('/api/purchase-orders/' + id + '/lines/' + lid, { method: 'DELETE' });
      const d = await r.json();
      if (!d.ok) { setStatus('Delete failed: ' + d.error, 'err'); return; }
      load();
    } else if (unallocBtn) {
      if (!confirm('Remove this allocation? The SO line will become unallocated.')) return;
      const r = await fetch('/api/so-po-allocations/' + unallocBtn.dataset.aid, { method: 'DELETE' });
      const d = await r.json();
      if (!d.ok) { setStatus('Unalloc failed: ' + d.error, 'err'); return; }
      load();
    }
  });

  actionsEl.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;
    if (act === 'delete') {
      if (!confirm('Delete this draft purchase order?')) return;
      const r = await fetch('/api/purchase-orders/' + id, { method: 'DELETE' });
      const d = await r.json();
      if (!d.ok) { setStatus('Delete failed: ' + d.error, 'err'); return; }
      location.href = '/orders/purchase-orders';
      return;
    }
    if (act === 'receive') {
      openReceiveModal(currentPo);
      return;
    }
    if (act === 'email') {
      const supplierName = currentPo.supplier_name || 'the supplier';
      const defaultTo = ''; // let the server look up the primary contact
      const to = prompt(
        `Email this PO PDF to ${supplierName}?\n\nLeave blank to send to the supplier's primary contact,\nor type an email address to override:`,
        defaultTo
      );
      if (to === null) return; // cancelled
      btn.disabled = true;
      btn.textContent = 'Sending…';
      try {
        const r = await fetch('/api/purchase-orders/' + id + '/email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(to.trim() ? { to: to.trim() } : {})
        });
        const d = await r.json();
        if (!d.ok) { setStatus('Email failed: ' + d.error, 'err'); return; }
        setStatus(`✓ Emailed to ${d.sent_to}${d.archive_error ? ' (archive: ' + d.archive_error + ')' : d.archived ? ' · archived to SharePoint' : ''}`, 'ok');
        load();
      } catch (err) {
        setStatus('Email failed: ' + err.message, 'err');
      } finally {
        btn.disabled = false;
      }
      return;
    }
    const prompts = {
      release: 'Release this PO to the supplier? Once released, the supplier ref locks for audit.',
      cancel:  'Cancel this PO?',
      close:   'Close this PO? Use when the remaining qty will not be delivered.'
    };
    if (!confirm(prompts[act])) return;
    const r = await fetch('/api/purchase-orders/' + id + '/status', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: act })
    });
    const d = await r.json();
    if (!d.ok) { setStatus('Action failed: ' + d.error, 'err'); return; }
    load();
  });

  await preload();
  load();
</script>

</body>
</html>
