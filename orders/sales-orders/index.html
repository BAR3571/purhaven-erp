<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Orders · PurHaven Back Office</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body data-page="orders">

<div id="tabs-mount"></div>

<div class="page-header">
  <h1>📦 Sales Orders</h1>
  <div class="actions">
    <button type="button" class="btn btn-ghost" id="import-website-btn" title="Pull paid orders from purhaven.co.uk into draft SOs">↘ Import from website</button>
    <button type="button" class="btn btn-primary" id="new-so-btn">+ New Sales Order</button>
  </div>
</div>

<div id="import-result" style="margin-bottom:12px;"></div>

<div class="search-row">
  <input type="search" id="q" placeholder="Search SO#, customer, ref…">
  <select id="status">
    <option value="">All statuses</option>
    <option value="draft">Draft</option>
    <option value="confirmed">Confirmed</option>
    <option value="picking">Picking</option>
    <option value="part_despatched">Part despatched</option>
    <option value="despatched">Despatched</option>
    <option value="invoiced">Invoiced</option>
    <option value="complete">Complete</option>
    <option value="on_hold">On hold</option>
    <option value="cancelled">Cancelled</option>
  </select>
</div>

<div class="card" style="padding: 0;">
  <div class="table-wrap">
    <table class="data">
      <thead>
        <tr>
          <th>SO #</th>
          <th>Customer</th>
          <th>Customer ref</th>
          <th>Order date</th>
          <th>Required</th>
          <th>Status</th>
          <th>Allocation</th>
          <th style="text-align:right">Lines</th>
          <th style="text-align:right">Total</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="10" class="empty">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module">
  import { mountShell, renderOrdersTabs, fmt, money, dateOnly } from '/app.js';
  await mountShell();
  document.getElementById('tabs-mount').innerHTML = `<div class="orders-tabs">${renderOrdersTabs('sales-orders')}</div>`;

  const rowsEl = document.getElementById('rows');
  const q = document.getElementById('q');
  const statusSel = document.getElementById('status');
  let timer;

  async function load() {
    const params = new URLSearchParams();
    if (q.value.trim()) params.set('q', q.value.trim());
    if (statusSel.value) params.set('status', statusSel.value);
    rowsEl.innerHTML = '<tr><td colspan="10" class="empty">Loading…</td></tr>';
    const r = await fetch('/api/sales-orders?' + params.toString());
    const d = await r.json();
    if (!d.ok) { rowsEl.innerHTML = `<tr><td colspan="10" class="empty">Error: ${d.error}</td></tr>`; return; }
    if (d.sales_orders.length === 0) {
      rowsEl.innerHTML = '<tr><td colspan="10" class="empty"><h3>No sales orders yet</h3><p>Click <strong>+ New Sales Order</strong> to create one.</p></td></tr>';
      return;
    }
    rowsEl.innerHTML = d.sales_orders.map(so => {
      const outstanding = Number(so.qty_outstanding || 0);
      const allocSerials = Number(so.qty_alloc_serials || 0);
      const allocPo = Number(so.qty_alloc_po || 0);
      const allocTotal = allocSerials + allocPo;
      const isOpen = ['confirmed', 'picking', 'part_despatched'].includes(so.status);

      let allocChip = '';
      let action = `<a href="/orders/sales-orders/detail?id=${so.id}" class="btn btn-ghost">Open →</a>`;

      if (so.status === 'despatched' || so.status === 'complete' || so.status === 'invoiced') {
        allocChip = '<span class="pill pill-despatched">Shipped</span>';
      } else if (so.status === 'cancelled') {
        allocChip = '<span class="pill pill-cancelled">N/A</span>';
      } else if (outstanding === 0) {
        allocChip = '<span class="pill pill-despatched">Done</span>';
      } else if (allocTotal === 0) {
        allocChip = '<span class="pill pill-cancelled" title="Nothing allocated yet">⨯ None</span>';
      } else if (allocTotal < outstanding) {
        allocChip = `<span class="pill pill-on-hold" title="Allocated ${allocTotal}/${outstanding}">${allocTotal}/${outstanding} part</span>`;
      } else if (allocSerials >= outstanding) {
        allocChip = `<span class="pill pill-despatched" title="All units in stock">✓ Stock (${allocSerials})</span>`;
      } else {
        // Fully covered but partly waiting on PO
        allocChip = `<span class="pill pill-confirmed" title="Stock ${allocSerials} · PO ${allocPo}">PO ${allocPo} · stk ${allocSerials}</span>`;
      }

      if (isOpen && allocSerials >= outstanding && outstanding > 0) {
        action = `<button type="button" class="btn btn-primary" data-act="quick-despatch" data-soid="${so.id}" title="Create pick list using ${allocSerials} allocated serial${allocSerials===1?'':'s'}">📋 Pick list</button>`;
      }

      return `
        <tr>
          <td class="mono"><a href="/orders/sales-orders/detail?id=${so.id}">${fmt(so.so_number)}</a></td>
          <td><a href="/customers/detail?id=${so.customer_id}">${fmt(so.customer_name)}</a><div style="color:var(--ink-dim);font-size:0.78rem;">${fmt(so.customer_code)}</div></td>
          <td>${fmt(so.customer_ref)}</td>
          <td>${dateOnly(so.order_date)}</td>
          <td>${so.required_date ? dateOnly(so.required_date) : '—'}</td>
          <td><span class="pill pill-${so.status.replace(/_/g,'-')}">${so.status.replace(/_/g,' ')}</span>${so.source === 'website' ? ' <span class="pill pill-confirmed" style="font-size:0.62rem;">web</span>' : ''}${so.paid_at ? ' <span class="pill pill-complete" style="font-size:0.62rem;" title="Paid on ' + new Date(so.paid_at).toLocaleDateString('en-GB') + '">paid</span>' : (so.status !== 'cancelled' && so.status !== 'draft' ? ' <span class="pill" style="background:#fde7e7;color:#991b1b;font-size:0.62rem;">unpaid</span>' : '')}</td>
          <td>${allocChip}</td>
          <td style="text-align:right">${so.line_count}</td>
          <td style="text-align:right"><strong>${money(so.total_pence, so.currency)}</strong></td>
          <td>${action}</td>
        </tr>
      `;
    }).join('');
  }

  // Quick pick-list button — creates the pick list, pops the picking-note PDF in a new tab,
  // then takes the user to the despatch detail page to continue the flow
  rowsEl.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-act="quick-despatch"]');
    if (!btn) return;
    const soid = parseInt(btn.dataset.soid, 10);
    if (!confirm('Create a pick list for the outstanding qty on all lines, and print the picking note now?')) return;
    btn.disabled = true;
    btn.textContent = 'Creating…';
    try {
      const soRes = await fetch('/api/sales-orders/' + soid).then(r => r.json());
      if (!soRes.ok) { alert('Load failed: ' + soRes.error); return; }
      const lines = soRes.sales_order.lines
        .map(l => ({ so_line_id: l.id, qty_to_despatch: l.quantity_ordered - l.quantity_despatched }))
        .filter(l => l.qty_to_despatch > 0);
      if (lines.length === 0) { alert('Nothing outstanding to despatch'); return; }
      const dn = await fetch('/api/despatches', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ so_id: soid, lines })
      }).then(r => r.json());
      if (!dn.ok) { alert('Create failed: ' + dn.error); return; }
      // Pre-open the PDF in a new tab BEFORE navigating, so popup blockers see the click
      window.open(`/api/despatches/${dn.despatch_id}/paperwork/picking-note`, '_blank');
      location.href = '/orders/despatch/detail?id=' + dn.despatch_id;
    } finally {
      btn.disabled = false;
    }
  });

  // "+ New" opens a small inline customer picker
  document.getElementById('new-so-btn').addEventListener('click', async () => {
    const customerCode = prompt('Customer account code or name to start an SO for?');
    if (!customerCode) return;
    const r = await fetch('/api/customers?q=' + encodeURIComponent(customerCode));
    const d = await r.json();
    if (!d.ok || d.customers.length === 0) { alert('No customer matched.'); return; }
    let target = d.customers[0];
    if (d.customers.length > 1) {
      const list = d.customers.map((c, i) => `${i + 1}. ${c.name} (${c.account_code})`).join('\n');
      const choice = prompt(`Pick a customer:\n${list}\n\nEnter number:`);
      const idx = parseInt(choice, 10) - 1;
      if (!d.customers[idx]) return;
      target = d.customers[idx];
    }
    const create = await fetch('/api/sales-orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ customer_id: target.id })
    });
    const cd = await create.json();
    if (!cd.ok) { alert('Failed: ' + cd.error); return; }
    window.location.href = '/orders/sales-orders/detail?id=' + cd.sales_order.id;
  });

  document.getElementById('import-website-btn').addEventListener('click', async () => {
    const btn = document.getElementById('import-website-btn');
    const resultEl = document.getElementById('import-result');
    btn.disabled = true;
    const oldLabel = btn.textContent;
    btn.textContent = 'Importing…';
    resultEl.innerHTML = '';
    try {
      const r = await fetch('/api/admin/import-website-orders', { method: 'POST' });
      const d = await r.json();
      if (!d.ok) {
        resultEl.innerHTML = `<div class="card accent-pink" style="padding:10px 14px;"><span style="color:#991b1b">${d.error || 'Import failed'}</span></div>`;
      } else {
        const errBit = d.errors?.length ? ` · ${d.errors.length} errored` : '';
        const noteBit = d.note ? ` — ${d.note}` : '';
        resultEl.innerHTML = `<div class="card accent-green" style="padding:10px 14px;">Imported ${d.imported}, skipped ${d.skipped} (already in ERP)${errBit}${noteBit}</div>`;
        load();
      }
    } catch (err) {
      resultEl.innerHTML = `<div class="card accent-pink" style="padding:10px 14px;"><span style="color:#991b1b">Network error: ${err.message}</span></div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = oldLabel;
    }
  });

  q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 200); });
  statusSel.addEventListener('change', load);
  load();
</script>

</body>
</html>
